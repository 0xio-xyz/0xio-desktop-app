  <text class="h" x="466" y="92">Websites</text>
  <text class="m" x="466" y="114">@0xio/sdk</text>
  <text class="b" x="466" y="138">dApps in any browser</text>
  <text class="b" x="466" y="157">through the extension</text>
  <text class="b" x="466" y="176">or straight to the socket</text>
