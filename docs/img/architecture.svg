  <text class="b" x="56" y="581">injected wallet provider</text>
  <text class="b" x="56" y="600">bridge command only</text>
  <rect class="box" x="446" y="484" width="250" height="128" rx="12"/>
  <text class="h" x="466" y="516">Main window</text>
  <text class="m" x="466" y="538">src/App.tsx</text>
  <text class="b" x="466" y="562">screens and reviews</text>
  <text class="b" x="466" y="581">in-app browser and Circles</text>
  <text class="b" x="466" y="600">builds every transaction</text>
  <rect class="box" x="446" y="716" width="250" height="128" rx="12"/>
  <text class="h" x="466" y="748">0xio services</text>
  <text class="m" x="466" y="770">oracle.0xio.xyz</text>
  <text class="b" x="466" y="794">OCT price</text>
  <text class="b" x="466" y="813">token, NFT and name lists</text>
  <text class="b" x="466" y="832">signed updates</text>
  <rect class="box" x="856" y="716" width="250" height="128" rx="12"/>
  <text class="h" x="876" y="748">Octra nodes</text>
  <text class="m" x="876" y="770">src/services/network/</text>
  <text class="b" x="876" y="794">mainnet and devnet</text>
  <text class="b" x="876" y="813">nodes you add</text>
  <text class="b" x="876" y="832">JSON-RPC with retries</text>
