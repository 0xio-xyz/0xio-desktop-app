  <text class="m" x="876" y="114">0xio-site-relay-v1</text>
  <text class="b" x="876" y="138">carries a site's requests</text>
  <text class="b" x="876" y="157">names the site itself</text>
  <text class="b" x="876" y="176">never signs for it</text>
  <rect class="box" x="36" y="292" width="250" height="128" rx="12"/>
  <text class="h" x="56" y="324">Menu bar panel</text>
  <text class="m" x="56" y="346">src/tray/</text>
  <text class="b" x="56" y="370">site reviews</text>
  <text class="b" x="56" y="389">balance and quick actions</text>
  <text class="b" x="56" y="408">no wallet or PVAC commands</text>
  <rect class="box" x="446" y="292" width="250" height="128" rx="12"/>
  <text class="h" x="466" y="324">Rust core</text>
  <text class="m" x="466" y="346">src-tauri/src/</text>
  <text class="b" x="466" y="370">vault, keys and signing</text>
  <text class="b" x="466" y="389">native PVAC engine</text>
  <text class="b" x="466" y="408">window guards and site frames</text>
  <rect class="box" x="856" y="292" width="250" height="128" rx="12"/>
  <text class="h" x="876" y="324">Local socket</text>
  <text class="m" x="876" y="346">ws://127.0.0.1:19345</text>
  <text class="b" x="876" y="370">pairing (0xio-pair-v1)</text>
  <text class="b" x="876" y="389">site queue and records</text>
  <text class="b" x="876" y="408">proofs for the extension</text>
  <rect class="box" x="36" y="484" width="250" height="128" rx="12"/>
