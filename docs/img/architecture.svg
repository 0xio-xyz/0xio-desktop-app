<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1142 922" width="1142" height="922" role="img" aria-labelledby="t d">
  <title id="t">0xio Desktop architecture</title>
  <desc id="d">In the browser, a website reaches 0xio Desktop through the 0xio extension, which relays its requests over a paired session on the local socket, or connects to the local socket straight from its own origin. Inside 0xio Desktop the Rust core holds the vault, signs and runs the PVAC engine. The main window, the menu bar panel and dApp windows call the Rust core through commands and events; the local socket queues site requests for review. The Rust core sends JSON-RPC to Octra nodes, and the main window reads prices and token lists from 0xio services.</desc>
